pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,json}'
      run: yarn biome format --write {staged_files}
      stage_fixed: true
    lint:
      glob: '*.ts'
      run: yarn oxlint {staged_files}

pre-push:
  commands:
    typecheck:
      run: yarn typecheck
    test:
      run: yarn test
