pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,json}'
      # launchd/jobs.json は biome の includes 外。それだけを commit すると「対象 0 件」で落ちるのを防ぐ
      run: yarn biome format --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    lint:
      glob: '*.ts'
      run: yarn oxlint {staged_files}

pre-push:
  commands:
    typecheck:
      run: yarn typecheck
    test:
      run: yarn test
